<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="920" height="560" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Kwik 112 — layered intake architecture</text>
  <text x="460" y="54" text-anchor="middle" font-size="11.5" fill="#64748b">The AI is the pipeline. The engineering story is what the model is forbidden to do.</text>

  <!-- Caller -->
  <rect x="30" y="90" width="130" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="95" y="122" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Citizen</text>
  <text x="95" y="140" text-anchor="middle" font-size="10.5" fill="#475569">keypad phone · 2G</text>
  <text x="95" y="155" text-anchor="middle" font-size="10.5" fill="#475569">enters own number · answers</text>

  <line x1="160" y1="133" x2="205" y2="133" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Layer 1 voice -->
  <rect x="210" y="82" width="190" height="102" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="305" y="104" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8" letter-spacing="1">LAYER 1 · VOICE AI</text>
  <text x="305" y="124" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">CALL-E · the phone rings</text>
  <text x="305" y="141" text-anchor="middle" font-size="10.5" fill="#334155">Hindi practice intake</text>
  <text x="305" y="156" text-anchor="middle" font-size="10.5" fill="#334155">structured result_schema</text>
  <text x="305" y="171" text-anchor="middle" font-size="10" fill="#64748b">self-identifying AI demo</text>

  <line x1="400" y1="133" x2="445" y2="133" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Layer 2 rules -->
  <rect x="450" y="82" width="190" height="102" rx="10" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="545" y="104" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c" letter-spacing="1">LAYER 2 · SAFETY FLOOR</text>
  <text x="545" y="124" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Deterministic rules</text>
  <text x="545" y="141" text-anchor="middle" font-size="10.5" fill="#334155">multilingual severity grade</text>
  <text x="545" y="156" text-anchor="middle" font-size="10.5" fill="#334155">p50 ≈ 0.042 ms</text>
  <text x="545" y="171" text-anchor="middle" font-size="10" font-weight="600" fill="#b91c1c">runs before any model</text>

  <line x1="640" y1="133" x2="685" y2="133" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Layer 3 LLM -->
  <rect x="690" y="82" width="200" height="102" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="790" y="104" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9" letter-spacing="1">LAYER 3 · REFINEMENT</text>
  <text x="790" y="124" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">GLM-4.5-Flash</text>
  <text x="790" y="141" text-anchor="middle" font-size="10.5" fill="#334155">type · subtype · location</text>
  <text x="790" y="156" text-anchor="middle" font-size="10.5" fill="#334155">persons · condition</text>
  <text x="790" y="171" text-anchor="middle" font-size="10" font-weight="600" fill="#b91c1c">escalate-only · floor-guarded</text>

  <!-- Floor guard between L3 and console -->
  <line x1="790" y1="184" x2="790" y2="240" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#arrR)"/>
  <rect x="700" y="196" width="180" height="34" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-dasharray="4 3"/>
  <text x="790" y="217" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b91c1c">enforceLocalSafetyFloor()</text>

  <!-- Console row -->
  <line x1="545" y1="184" x2="545" y2="270" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="210" y="272" width="680" height="118" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="550" y="296" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d" letter-spacing="1">LAYER 4 · DISPATCHER CONSOLE</text>
  <rect x="232" y="308" width="150" height="62" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="307" y="332" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Graded cards</text>
  <text x="307" y="350" text-anchor="middle" font-size="9.5" fill="#64748b">transcript · emotion</text>
  <rect x="398" y="308" width="150" height="62" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="473" y="332" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Map + routing</text>
  <text x="473" y="350" text-anchor="middle" font-size="9.5" fill="#64748b">geocode · OSRM roads</text>
  <rect x="564" y="308" width="150" height="62" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="639" y="332" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Kanban + alerts</text>
  <text x="639" y="350" text-anchor="middle" font-size="9.5" fill="#64748b">fusion · escalation</text>
  <rect x="716" y="308" width="152" height="62" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="792" y="332" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Audit timeline</text>
  <text x="792" y="350" text-anchor="middle" font-size="9.5" fill="#64748b">self-documenting</text>

  <!-- Human gate -->
  <line x1="550" y1="390" x2="550" y2="436" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="330" y="438" width="440" height="74" rx="10" fill="#fffbeb" stroke="#d97706"/>
  <text x="550" y="462" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">HUMAN-ONLY DECISION GATES — the AI never dispatches</text>
  <text x="550" y="482" text-anchor="middle" font-size="10.5" fill="#78350f">INTAKE → DISPATCH → RESOLUTION · every override requires a written reason</text>
  <text x="550" y="499" text-anchor="middle" font-size="10" fill="#92400e">enforced in code (checkpoint guard), not in prompts</text>

  <text x="460" y="543" text-anchor="middle" font-size="10" fill="#94a3b8">Every transcript is wrapped as untrusted data · a committed test fires a prompt-injection attempt and asserts the floor holds · CI fails the build if critical recall drops below 1.0</text>
</svg>
